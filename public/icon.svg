<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="45%" stop-color="#FFC72C" />
      <stop offset="100%" stop-color="#D49A00" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1D24" />
      <stop offset="100%" stop-color="#0B0C0E" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#FFC72C" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Luxury Squircle Badge Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Inner Subtle Accent Ring -->
  <rect x="5" y="5" width="54" height="54" rx="13" fill="none" stroke="url(#goldGrad)" stroke-width="0.75" stroke-opacity="0.15" />

  <!-- Iconic Rwanda Kigali Rentals Gold Crest & Crown -->
  <g filter="url(#softGlow)" transform="translate(32, 33) scale(0.95) translate(-32, -33)">
    <!-- Crown / Apex Tiara -->
    <path d="M22 22 L27 26 L32 19 L37 26 L42 22 L40 28 L24 28 Z" fill="url(#goldGrad)" />
    
    <!-- Geometric Luxury K Monogram -->
    <!-- Vertical Pillar -->
    <rect x="23" y="30" width="4" height="18" rx="1" fill="url(#goldGrad)" />
    
    <!-- Diagonal Arms of K -->
    <path d="M27 38 L38 29.5 C38.8 28.8 40 29.5 40 30.5 L40 32 L31 39.5 L41 47.5 L41 49 C41 50 39.8 50.6 39 50 L27 41 Z" fill="url(#goldGrad)" />

    <!-- Center Jewel Accent -->
    <circle cx="32" cy="19" r="1.5" fill="#FFF8E1" />
  </g>
</svg>
